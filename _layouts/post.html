---
layout: default
---

<div class="post-wrapper-outer">
  <article class="content-card post-full">
    <header class="post-header">
      <h1 class="post-full-title">{{ page.title }}</h1>
      <p class="post-meta">
        <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%b %-d, %Y" }}</time>
        &nbsp;&bull;&nbsp; {{ page.author | default: site.author }}
      </p>
      {% if page.tags and page.tags.size > 0 %}
      <div class="post-tags">
        {% for tag in page.tags %}
        <a href="{{ '/tags' | relative_url }}#{{ tag | slugify }}" class="tag">{{ tag }}</a>
        {% endfor %}
      </div>
      {% endif %}
    </header>

    <div class="post-content">
      {{ content }}
    </div>

    <footer class="post-footer">
      <hr>
      <p><a href="{{ '/blog' | relative_url }}">&larr; Back to Blog</a></p>
    </footer>
  </article>
</div>
